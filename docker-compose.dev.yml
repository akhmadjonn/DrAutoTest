# Development override - run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: ./backend
      dockerfile: src/DrAutoTest.API/Dockerfile
      target: development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./backend:/app/src
    ports:
      - "5000:5000"
      - "5001:5001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "4200:4200"
    command: npx ng serve --host 0.0.0.0 --port 4200

  # Remove nginx in dev, access services directly
  nginx:
    profiles:
      - production
