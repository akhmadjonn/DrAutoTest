version: '3.8'

# Docker Swarm deployment stack
# Deploy with: docker stack deploy -c docker-stack.yml drautotest

services:
  postgres:
    image: postgres:16-alpine
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    environment:
      POSTGRES_DB: drautotest
      POSTGRES_USER: drautotest_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    secrets:
      - db_password

  redis:
    image: redis:7-alpine
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    command: redis-server --appendonly yes --requirepass_file /run/secrets/redis_password
    volumes:
      - redis_data:/data
    networks:
      - backend
    secrets:
      - redis_password

  minio:
    image: minio/minio:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
    secrets:
      - minio_access_key
      - minio_secret_key

  api:
    image: drautotest/api:latest
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
    networks:
      - backend
      - frontend
    secrets:
      - db_password
      - redis_password
      - jwt_secret

  frontend:
    image: drautotest/frontend:latest
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - frontend

  nginx:
    image: nginx:alpine
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
    networks:
      - frontend
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  backend:
    driver: overlay
  frontend:
    driver: overlay

secrets:
  db_password:
    external: true
  redis_password:
    external: true
  jwt_secret:
    external: true
  minio_access_key:
    external: true
  minio_secret_key:
    external: true

configs:
  nginx_conf:
    file: ./nginx/nginx.conf
